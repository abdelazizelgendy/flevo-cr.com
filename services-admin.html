<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة خدمات FLEVO</title><link rel="stylesheet" href="assets/site.css"><style>
:root{--navy:#071b31;--teal:#13b7bd;--bg:#f4f7fa;--danger:#d64545}body{background:var(--bg);color:#122033}.top{background:var(--navy);color:#fff;padding:17px 0}.top .container,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 15px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--teal);color:#052032}.soft{background:#e6eef5;color:#0b2b49}.danger{background:#ffe4e4;color:#922}.wrap{padding:28px 0}.layout{display:grid;grid-template-columns:360px 1fr;gap:20px}.box{background:#fff;border-radius:16px;padding:20px;box-shadow:0 10px 35px #0b274013}.row{border:1px solid #dde6ed;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}.row.active{border-color:var(--teal);background:#effcfc}.row small{display:block;color:#687989}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #d6e0e8;border-radius:9px;font:inherit}textarea{min-height:100px}.login{position:fixed;inset:0;background:#06182ceb;display:grid;place-items:center;z-index:100}.login-card{width:min(420px,92%);background:#fff;padding:28px;border-radius:18px;text-align:center}.login-card img{width:180px;margin:auto}@media(max-width:850px){.layout,.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style><link rel="stylesheet" href="assets/layout-fixes.css">
<link rel="stylesheet" href="assets/motion.css">
<link rel="stylesheet" href="assets/navigation-fixes.css">
<link rel="stylesheet" href="assets/unified-auth.css">
</head><body data-flevo-protected="true" data-flevo-logout-url="index.html">
<header class="top"><div class="container"><div><b>FLEVO — إدارة الخدمات</b><small style="display:block;opacity:.7">عربي / English</small></div><div class="actions"><button class="btn soft" onclick="location.href='admin.html'">المشروعات</button><button class="btn soft" onclick="location.href='settings.html'">الإعدادات</button><button class="btn soft" onclick="location.href='quotes.html'">الطلبات</button><button class="btn primary" id="new">+ خدمة جديدة</button><button class="btn soft" id="logout" data-flevo-logout>خروج</button></div></div></header>
<main class="wrap"><div class="container layout"><aside class="box"><div id="list"></div></aside><section class="box" id="editor">اختر خدمة أو أضف خدمة جديدة.</section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase-config.js"></script><script src="assets/data-store.js"></script><script src="assets/unified-auth.js"></script><script>
let items=[],selected=null;const esc=v=>String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));async function load(){items=await FlevoStore.getServices(true);renderList();if(selected){const x=items.find(i=>i.id===selected);if(x)edit(x)}}function renderList(){list.innerHTML=items.map(x=>`<div class="row ${selected===x.id?'active':''}" data-id="${x.id}"><b>${esc(x.icon)} ${esc(x.title_ar)}</b><small>${x.title_en||''} · ${x.published?'منشورة':'مخفية'} · ترتيب ${x.display_order}</small></div>`).join('')||'<p>لا توجد خدمات</p>';document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{selected=r.dataset.id;edit(items.find(x=>x.id===selected));renderList()})}function edit(x={id:null,title_ar:'خدمة جديدة',title_en:'New Service',description_ar:'',description_en:'',icon:'✦',published:true,display_order:items.length+1}){editor.innerHTML=`<form id="form"><div class="grid"><div><label>العنوان العربي</label><input name="title_ar" value="${esc(x.title_ar)}" required></div><div><label>English Title</label><input name="title_en" value="${esc(x.title_en)}"></div><div><label>الأيقونة</label><input name="icon" value="${esc(x.icon)}"></div><div><label>الترتيب</label><input name="display_order" type="number" value="${x.display_order||0}"></div><div><label>الحالة</label><select name="published"><option value="true" ${x.published?'selected':''}>منشورة</option><option value="false" ${!x.published?'selected':''}>مخفية</option></select></div><div></div><div class="full"><label>الوصف العربي</label><textarea name="description_ar">${esc(x.description_ar)}</textarea></div><div class="full"><label>English Description</label><textarea name="description_en">${esc(x.description_en)}</textarea></div><div class="full actions"><button class="btn primary">حفظ</button>${x.id?'<button type="button" class="btn danger" id="delete">حذف</button>':''}</div></div></form>`;document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const d={...x,title_ar:f.get('title_ar'),title_en:f.get('title_en'),description_ar:f.get('description_ar'),description_en:f.get('description_en'),icon:f.get('icon'),published:f.get('published')==='true',display_order:Number(f.get('display_order'))};const saved=await FlevoStore.saveService(d);selected=saved.id;await load()};if(x.id)document.querySelector('#delete').onclick=async()=>{if(confirm('حذف الخدمة؟')){await FlevoStore.deleteService(x.id);selected=null;editor.textContent='تم الحذف';load()}}}document.querySelector('#new').onclick=()=>{selected=null;edit()};FlevoUnifiedAuth.protectPage({onAuthenticated:load});
</script><script src="assets/motion.js" defer></script>
<script src="assets/navigation-audit.js" defer></script>
</body></html>
