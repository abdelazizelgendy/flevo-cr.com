<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات عروض الأسعار | FLEVO</title><link rel="stylesheet" href="assets/site.css"><style>
:root{--navy:#071b31;--teal:#13b7bd;--bg:#f4f7fa;--line:#dbe5ec;--muted:#687989}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#122033;font-family:Cairo,Arial,sans-serif}.qtop{background:var(--navy);color:white;padding:16px 0;position:sticky;top:0;z-index:20}.qtop .container{display:flex;justify-content:space-between;align-items:center;gap:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.abtn{border:0;border-radius:9px;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--teal);color:#062335}.soft{background:#e5eef5;color:#0b2b49}.danger{background:#ffe2e2;color:#8e1e1e}.wrap{padding:25px 0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.kpi{background:#fff;border-radius:14px;padding:18px;box-shadow:0 8px 26px #0b274010}.kpi small{color:var(--muted)}.kpi strong{font-size:30px;display:block;margin-top:3px}.toolbar{background:#fff;border-radius:14px;padding:14px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select{padding:11px;border:1px solid var(--line);border-radius:9px;font:inherit}.toolbar input{flex:1;min-width:230px}.layout{display:grid;grid-template-columns:390px 1fr;gap:18px}.list,.detail{background:#fff;border-radius:15px;padding:16px;box-shadow:0 10px 32px #0b274012}.item{border:1px solid #e1e8ee;border-radius:11px;padding:13px;margin-bottom:9px;cursor:pointer}.item.active{border-color:var(--teal);background:#eefcfc}.itemhead{display:flex;justify-content:space-between;gap:10px}.item small{color:var(--muted);display:block;margin-top:5px}.badge{font-size:11px;padding:4px 8px;border-radius:99px;background:#e8eef3;white-space:nowrap}.badge.new{background:#fff1cc;color:#875d00}.badge.contacted{background:#e7f0ff;color:#174f92}.badge.pricing{background:#f2e9ff;color:#6330a5}.badge.sent{background:#dff7f6;color:#08747a}.badge.accepted{background:#dcf7e6;color:#16753a}.badge.rejected{background:#ffe3e3;color:#9b2929}.detail h2{margin-top:0}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{background:#f6f9fb;border-radius:10px;padding:12px}.field small{display:block;color:var(--muted);margin-bottom:4px}.full{grid-column:1/-1}.notes{width:100%;min-height:100px;padding:12px;border:1px solid var(--line);border-radius:9px;font:inherit}.login{position:fixed;inset:0;background:#06182cef;display:grid;place-items:center;z-index:100}.loginbox{background:white;width:min(420px,92vw);padding:28px;border-radius:18px;text-align:center}.loginbox img{width:180px;margin:auto}.loginbox input{width:100%;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:9px}.empty{color:var(--muted);padding:40px 10px;text-align:center}@media(max-width:950px){.layout{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.qtop .container{align-items:flex-start;flex-direction:column}.fields{grid-template-columns:1fr}.full{grid-column:auto}.kpis{grid-template-columns:1fr 1fr}.layout{gap:12px}}
.livebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;color:var(--muted);font-size:13px}.live-status{display:inline-flex;align-items:center;gap:7px;font-weight:800}.live-status:before{content:"";width:9px;height:9px;border-radius:50%;background:#93a1ad}.live-status[data-mode="live"]:before{background:#19ae68;box-shadow:0 0 0 4px #19ae6818}.live-status[data-mode="loading"]:before{background:#e3a11c;animation:pulse 1s infinite}.live-status[data-mode="error"]:before{background:#d94a4a}.qtoast{position:fixed;left:20px;bottom:20px;z-index:1000;max-width:min(390px,calc(100vw - 40px));padding:13px 17px;border-radius:12px;background:#10283d;color:white;box-shadow:0 16px 40px #06192a40;transform:translateY(20px);opacity:0;pointer-events:none;transition:.22s}.qtoast.show{transform:none;opacity:1}.qtoast[data-type="success"]{background:#087d69}.qtoast[data-type="error"]{background:#a4303c}@keyframes pulse{50%{opacity:.35}}
</style><link rel="stylesheet" href="assets/layout-fixes.css">
