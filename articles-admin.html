<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة مقالات FLEVO</title><link rel="stylesheet" href="assets/site.css"><style>
:root{--navy:#071b31;--teal:#13b7bd;--bg:#f4f7fa;--danger:#d64545}body{background:var(--bg);color:#122033}.top{background:var(--navy);color:#fff;padding:17px 0}.top .container,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 15px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--teal);color:#052032}.soft{background:#e6eef5;color:#0b2b49}.danger{background:#ffe4e4;color:#922}.wrap{padding:28px 0}.layout{display:grid;grid-template-columns:360px 1fr;gap:20px}.box{background:#fff;border-radius:16px;padding:20px;box-shadow:0 10px 35px #0b274013}.row{border:1px solid #dde6ed;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}.row.active{border-color:var(--teal);background:#effcfc}.row small{display:block;color:#687989}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #d6e0e8;border-radius:9px;font:inherit}textarea{min-height:100px}.login{position:fixed;inset:0;background:#06182ceb;display:grid;place-items:center;z-index:100}.login-card{width:min(420px,92%);background:#fff;padding:28px;border-radius:18px;text-align:center}.login-card img{width:180px;margin:auto}@media(max-width:850px){.layout,.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style><link rel="stylesheet" href="assets/flevo-app.css?v=5.12"/>
<link rel="stylesheet" href="assets/motion.css">
<link rel="stylesheet" href="assets/unified-auth.css">
</head><body data-flevo-protected="true" data-flevo-logout-url="index.html">
<header class="top"><div class="container"><div><b>FLEVO — إدارة المقالات</b><small style="display:block;opacity:.7">عربي / English</small></div><div class="actions"><button class="btn soft" onclick="location.href='admin.html'">المشروعات</button><button class="btn soft" onclick="location.href='dashboard.html'">لوحة القيادة</button><button class="btn soft" onclick="location.href='services-admin.html'">الخدمات</button><button class="btn soft" onclick="location.href='quotes.html'">الطلبات</button><button class="btn primary" id="new">+ مقال جديد</button><button class="btn soft" id="logout" data-flevo-logout>خروج</button></div></div></header>
<main class="wrap"><div class="container layout"><aside class="box"><div id="list"></div></aside><section class="box" id="editor">اختر مقالاً أو أضف مقالاً جديداً.</section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase-config.js?v=5.12"></script><script src="assets/data-store.js?v=5.12"></script><script src="assets/unified-auth.js?v=5.12"></script><script>
let items=[],selected=null;const esc=v=>String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));async function load(){items=await FlevoStore.getArticles(true);renderList();if(selected){const x=items.find(i=>i.id===selected);if(x)edit(x)}}function renderList(){list.innerHTML=items.map(x=>`<div class="row ${selected===x.id?'active':''}" data-id="${x.id}"><b>${esc(x.title_ar)}</b><small>${esc(x.title_en||'')} · ${x.published?'منشور':'مخفي'} · ترتيب ${x.display_order}</small></div>`).join('')||'<p>لا توجد مقالات</p>';document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{selected=r.dataset.id;edit(items.find(x=>x.id===selected));renderList()})}function edit(x={id:null,slug:'',title_ar:'مقال جديد',title_en:'New Article',excerpt_ar:'',excerpt_en:'',category_ar:'',category_en:'',image_url:'',published:true,display_order:items.length+1}){editor.innerHTML=`<form id="form"><div class="grid"><div><label>Slug (رابط المقال)</label><input name="slug" value="${esc(x.slug||'')}" required></div><div><label>الترتيب</label><input name="display_order" type="number" value="${x.display_order||1}"></div><div><label>العنوان العربي</label><input name="title_ar" value="${esc(x.title_ar)}" required></div><div><label>English Title</label><input name="title_en" value="${esc(x.title_en||'')}"></div><div><label>التصنيف (عربي)</label><input name="category_ar" value="${esc(x.category_ar||'')}"></div><div><label>Category (English)</label><input name="category_en" value="${esc(x.category_en||'')}"></div><div class="full"><label>رابط الصورة</label><input name="image_url" value="${esc(x.image_url||'')}"></div><div><label>الحالة</label><select name="published"><option value="true" ${x.published?'selected':''}>منشور</option><option value="false" ${!x.published?'selected':''}>مخفي</option></select></div><div></div><div class="full"><label>مقتطف عربي</label><textarea name="excerpt_ar">${esc(x.excerpt_ar||'')}</textarea></div><div class="full"><label>English Excerpt</label><textarea name="excerpt_en">${esc(x.excerpt_en||'')}</textarea></div><div class="full actions"><button class="btn primary">حفظ</button>${x.id?'<button type="button" class="btn danger" id="delete">حذف</button>':''}</div></div></form>`;document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const d={...x,slug:f.get('slug'),title_ar:f.get('title_ar'),title_en:f.get('title_en'),excerpt_ar:f.get('excerpt_ar'),excerpt_en:f.get('excerpt_en'),category_ar:f.get('category_ar'),category_en:f.get('category_en'),image_url:f.get('image_url'),published:f.get('published')==='true',display_order:Number(f.get('display_order'))};const saved=await FlevoStore.saveArticle(d);selected=saved.id;await load()};if(x.id)document.querySelector('#delete').onclick=async()=>{if(confirm('حذف المقال؟')){await FlevoStore.deleteArticle(x.id);selected=null;editor.textContent='تم الحذف';load()}}}document.querySelector('#new').onclick=()=>{selected=null;edit()};FlevoUnifiedAuth.protectPage({onAuthenticated:load});
</script><script src="assets/motion.js?v=5.12" defer></script>
<script src="assets/navigation-audit.js?v=5.12" defer></script>
</body></html>
