<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة إدارة FLEVO</title><link rel="stylesheet" href="assets/site.css"><style>
:root{--navy:#071b31;--teal:#13b7bd;--bg:#f4f7fa;--danger:#d64545}body{background:var(--bg);color:#122033}.admin-top{background:var(--navy);color:#fff;padding:18px 0;position:sticky;top:0;z-index:10}.admin-top .container{display:flex;justify-content:space-between;gap:16px;align-items:center}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}.abtn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font:inherit;font-weight:700}.primary{background:var(--teal);color:#052032}.soft{background:#e5eef5;color:#0b2b49}.danger{background:#ffe2e2;color:#8e1e1e}.admin-wrap{padding:26px 0}.admin-grid{display:grid;grid-template-columns:360px 1fr;gap:22px}.side,.editor{background:#fff;border-radius:16px;box-shadow:0 10px 35px #0b274013;padding:18px}.searchbox{width:100%;padding:12px;border:1px solid #d6e0e8;border-radius:10px;margin-bottom:12px}.project-row{border:1px solid #e1e8ee;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;display:flex;gap:10px;align-items:center}.project-row.active{border-color:var(--teal);background:#effcfc}.project-row img{width:64px;height:48px;object-fit:cover;border-radius:8px}.project-row small{display:block;color:#687989}.badge{font-size:11px;padding:3px 7px;border-radius:99px;background:#e7f7f7;color:#08747a}.off{background:#eee;color:#777}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #d6e0e8;border-radius:9px;font:inherit}textarea{min-height:95px}.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}.thumb{position:relative}.thumb img{width:100%;height:90px;object-fit:cover;border-radius:8px}.thumb button{position:absolute;top:4px;left:4px;border:0;border-radius:50%;width:26px;height:26px;background:#fff;color:#b22;cursor:pointer}.login{position:fixed;inset:0;background:#06182ceb;display:grid;place-items:center;z-index:100}.login-card{width:min(420px,92%);background:#fff;padding:28px;border-radius:18px;text-align:center}.login-card img{width:150px}.toast{position:fixed;bottom:25px;left:25px;background:#071b31;color:#fff;padding:12px 18px;border-radius:10px;display:none;z-index:110}.note{background:#e9fbfb;border:1px solid #9be0e3;padding:10px;border-radius:10px;margin-bottom:14px}@media(max-width:900px){.admin-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.admin-top .container{align-items:flex-start;flex-direction:column}}</style><link rel="stylesheet" href="assets/flevo-app.css?v=5.12"/>
<link rel="stylesheet" href="assets/motion.css">

<link rel="stylesheet" href="assets/unified-auth.css">
</head><body data-flevo-protected="true" data-flevo-logout-url="index.html">
<header class="admin-top"><div class="container"><div><b>FLEVO — إدارة المشروعات السحابية</b><small style="display:block;opacity:.7">Supabase Cloud</small></div><button class="abtn soft" type="button" onclick="location.href='dashboard.html'">لوحة القيادة</button><button class="abtn soft" type="button" onclick="location.href='quotes.html'">طلبات عروض الأسعار</button><button class="abtn soft" type="button" onclick="location.href='services-admin.html'">الخدمات</button><button class="abtn soft" type="button" onclick="location.href='settings.html'">إعدادات الموقع</button><button class="abtn primary" id="newBtn">+ مشروع جديد</button><button class="abtn soft" id="refreshBtn">تحديث</button><button class="abtn soft" id="previewBtn">معاينة الموقع</button><button class="abtn soft" id="exportBtn">تصدير نسخة</button><button class="abtn danger" id="logoutBtn" data-flevo-logout>خروج</button></div></div></header>
<main class="admin-wrap"><div class="container"><div class="note">كل تعديل يُحفظ مباشرة في Supabase ويظهر على الموقع المنشور.</div><div class="admin-grid"><aside class="side"><input class="searchbox" id="adminSearch" placeholder="بحث..."><div id="list"></div></aside><section class="editor" id="editor"><p>اختر مشروعًا أو أنشئ مشروعًا جديدًا.</p></section></div></div></main><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase-config.js?v=5.12"></script><script src="assets/data-store.js?v=5.12"></script><script src="assets/unified-auth.js?v=5.12"></script><script>
let projects=[],selected=null;const $=s=>document.querySelector(s),catAr={booths:'بوثات المعارض',events:'الفعاليات',manufacturing:'التصنيع',special:'أعمال خاصة'};function toast(t){const x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2400)}function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function lines(v){return (v||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean)}function slug(v){return String(v).trim().toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/^-+|-+$/g,'')||'project-'+Date.now()}
async function load(){try{projects=await FlevoStore.getProjects(true);renderList()}catch(e){alert('تعذر تحميل البيانات: '+e.message)}}function renderList(){const q=$('#adminSearch').value.toLowerCase();const arr=projects.filter(p=>(p.titleAr+' '+p.titleEn+' '+p.client).toLowerCase().includes(q));$('#list').innerHTML=arr.map(p=>`<div class="project-row ${selected===p.id?'active':''}" data-id="${p.id}"><img src="${p.cover||'assets/logo.png'}"><div><b>${p.titleAr}</b><small>${p.client||'—'} · ترتيب ${p.order}</small><span class="badge ${p.published?'':'off'}">${p.published?'منشور':'مخفي'}</span></div></div>`).join('')||'<p>لا توجد مشروعات</p>';document.querySelectorAll('.project-row').forEach(r=>r.onclick=()=>openProject(r.dataset.id))}
function openProject(id){selected=id;renderList();renderEditor(projects.find(p=>p.id===id))}function newProject(){const p={id:'project-'+Date.now(),uuid:null,titleAr:'مشروع جديد',titleEn:'New Project',category:'booths',client:'',location:'مصر',year:new Date().getFullYear(),area:'',duration:'',cover:'',descriptionAr:'',scope:[],images:[],published:false,featured:false,order:projects.length+1};projects.push(p);openProject(p.id)}
function renderEditor(p){$('#editor').innerHTML=`<form id="form"><div class="form-grid"><div><label>Slug</label><input name="id" value="${esc(p.id)}" required></div><div><label>الترتيب</label><input name="order" type="number" value="${p.order}"></div><div><label>اسم عربي</label><input name="titleAr" value="${esc(p.titleAr)}" required></div><div><label>اسم إنجليزي</label><input name="titleEn" value="${esc(p.titleEn)}"></div><div><label>التصنيف</label><select name="category">${Object.entries(catAr).map(([k,v])=>`<option value="${k}" ${p.category===k?'selected':''}>${v}</option>`).join('')}</select></div><div><label>النشر</label><select name="published"><option value="true" ${p.published?'selected':''}>منشور</option><option value="false" ${!p.published?'selected':''}>مخفي</option></select></div><div><label>العميل</label><input name="client" value="${esc(p.client)}"></div><div><label>الموقع</label><input name="location" value="${esc(p.location)}"></div><div><label>السنة</label><input name="year" value="${esc(p.year)}"></div><div><label>المساحة</label><input name="area" value="${esc(p.area)}"></div><div><label>مدة التنفيذ</label><input name="duration" value="${esc(p.duration)}"></div><div><label>رابط الغلاف</label><input name="cover" value="${esc(p.cover)}"></div><div class="full"><label>الوصف</label><textarea name="descriptionAr">${esc(p.descriptionAr)}</textarea></div><div class="full"><label>نطاق الأعمال — بند بكل سطر</label><textarea name="scope">${esc((p.scope||[]).join('\n'))}</textarea></div><div class="full"><label>صور المشروع</label><input id="imageUpload" type="file" accept="image/*" multiple><div class="thumbs" id="thumbs">${(p.images||[]).map((src,i)=>`<div class="thumb"><img src="${src}"><button type="button" data-i="${i}">×</button></div>`).join('')}</div></div><div class="full admin-actions"><button class="abtn primary" type="submit">حفظ</button><button class="abtn soft" type="button" id="openPublic">فتح المشروع</button><button class="abtn danger" type="button" id="deleteBtn">حذف</button></div></div></form>`;
$('#form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);Object.assign(p,{id:slug(f.get('id')),order:+f.get('order')||999,titleAr:f.get('titleAr'),titleEn:f.get('titleEn'),category:f.get('category'),published:f.get('published')==='true',client:f.get('client'),location:f.get('location'),year:f.get('year'),area:f.get('area'),duration:f.get('duration'),cover:f.get('cover'),descriptionAr:f.get('descriptionAr'),scope:lines(f.get('scope'))});try{await FlevoStore.saveProject(p);toast('تم الحفظ');await load();selected=p.id;openProject(p.id)}catch(err){alert(err.message)}};
$('#imageUpload').onchange=async e=>{if(!p.uuid){alert('احفظ المشروع أولًا ثم ارفع الصور');return}for(const file of e.target.files){try{const u=await FlevoStore.uploadImage(file,p.id);await FlevoStore.addProjectImage(p.uuid,u.url,u.path,(p.images||[]).length,false);p.images.push(u.url);if(!p.cover){p.cover=u.url;await FlevoStore.saveProject(p)}toast('تم رفع '+file.name)}catch(err){alert(err.message)}}await load();openProject(p.id)};
document.querySelectorAll('.thumb button').forEach(b=>b.onclick=async()=>{const url=p.images[+b.dataset.i];if(confirm('حذف الصورة من معرض المشروع؟')){await FlevoStore.removeProjectImage(p.uuid,url);await load();openProject(p.id)}});$('#openPublic').onclick=()=>window.open('project.html?id='+encodeURIComponent(p.id),'_blank');$('#deleteBtn').onclick=async()=>{if(confirm('حذف المشروع؟')){await FlevoStore.deleteProject(p);selected=null;await load();$('#editor').innerHTML='<p>تم الحذف.</p>'}}}
$('#newBtn').onclick=newProject;$('#refreshBtn').onclick=load;$('#previewBtn').onclick=()=>window.open('projects.html','_blank');$('#exportBtn').onclick=()=>FlevoStore.export(projects);$('#adminSearch').oninput=renderList;FlevoUnifiedAuth.protectPage({onAuthenticated:load});
</script><script src="assets/motion.js?v=5.12" defer></script>
<script src="assets/navigation-audit.js?v=5.12" defer></script>
</body></html>
