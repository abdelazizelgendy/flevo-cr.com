<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إعدادات FLEVO</title><link rel="stylesheet" href="assets/site.css"><style>
:root{--navy:#071b31;--teal:#13b7bd;--bg:#f4f7fa}body{background:var(--bg);color:#122033}.top{background:var(--navy);color:#fff;padding:17px 0}.top .container,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 15px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--teal);color:#052032}.soft{background:#e6eef5;color:#0b2b49}.wrap{padding:28px 0}.panel{background:#fff;border-radius:18px;padding:24px;box-shadow:0 12px 40px #0b274014}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.full{grid-column:1/-1}label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}input,textarea{width:100%;padding:12px;border:1px solid #d5e0e8;border-radius:10px;font:inherit}textarea{min-height:90px}.note{padding:12px;background:#e9fbfb;border:1px solid #a4e4e7;border-radius:10px;margin-bottom:18px}.msg{margin-top:12px;font-weight:700}.hero-bg-box{border:1px solid #d8e4eb;border-radius:16px;padding:18px;background:#f8fbfd}.hero-preview{height:260px;border-radius:14px;overflow:hidden;background:#0a2239 center/cover no-repeat;position:relative;border:1px solid #d2dee7}.hero-preview:after{content:"معاينة خلفية الواجهة";position:absolute;inset:auto 0 0;padding:14px;color:#fff;font-weight:800;background:linear-gradient(transparent,rgba(3,18,32,.9));text-align:center}.upload-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.upload-row input[type=file]{flex:1;min-width:240px;background:#fff}.danger{background:#fee5e5;color:#9b1c1c}.progress{font-size:13px;color:#507080;margin-top:8px}.login{position:fixed;inset:0;background:#06182ceb;display:grid;place-items:center;z-index:100}.login-card{width:min(420px,92%);background:#fff;padding:28px;border-radius:18px;text-align:center}.login-card img{width:180px;margin:auto}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style><link rel="stylesheet" href="assets/layout-fixes.css">
<link rel="stylesheet" href="assets/motion.css">
<link rel="stylesheet" href="assets/navigation-fixes.css">
<link rel="stylesheet" href="assets/unified-auth.css">
</head><body data-flevo-protected="true" data-flevo-logout-url="index.html">
<header class="top"><div class="container"><div><b>FLEVO — إعدادات الموقع</b><small style="display:block;opacity:.7">البيانات العامة والمحتوى الرئيسي</small></div><div class="actions"><button class="btn soft" onclick="location.href='admin.html'">المشروعات</button><button class="btn soft" onclick="location.href='services-admin.html'">الخدمات</button><button class="btn soft" onclick="location.href='quotes.html'">طلبات الأسعار</button><button class="btn soft" id="preview">معاينة</button><button class="btn soft" id="logout" data-flevo-logout>خروج</button></div></div></header>
<main class="wrap"><div class="container"><div class="note">أي تغيير هنا يظهر في الموقع بعد الحفظ وإعادة تحميل الصفحة.</div><form class="panel" id="form"><div class="grid">
<div><label>اسم الشركة بالعربي</label><input name="company_name_ar"></div><div><label>Company Name</label><input name="company_name_en"></div>
<div><label>العنوان الرئيسي بالعربي</label><input name="hero_title_ar"></div><div><label>Hero Title English</label><input name="hero_title_en"></div>
<div class="full"><label>الوصف الرئيسي بالعربي</label><textarea name="hero_description_ar"></textarea></div><div class="full"><label>Hero Description English</label><textarea name="hero_description_en"></textarea></div>
<div class="full hero-bg-box"><label>خلفية الواجهة الرئيسية</label><div class="hero-preview" id="heroPreview"></div><div class="upload-row"><input type="file" id="heroFile" accept="image/jpeg,image/png,image/webp"><button class="btn primary" type="button" id="uploadHero">رفع وحفظ الخلفية</button><button class="btn danger" type="button" id="removeHero">إزالة الخلفية</button></div><div class="progress" id="heroProgress">يفضل صورة أفقية 1920×1080 بصيغة WebP أو JPG وأقل من 3 MB.</div><input type="hidden" name="hero_background_url"></div>
<div><label>الهاتف</label><input name="phone" dir="ltr"></div><div><label>واتساب</label><input name="whatsapp" dir="ltr"></div>
<div><label>البريد الإلكتروني</label><input name="email" dir="ltr"></div><div><label>الموقع الإلكتروني</label><input name="website" dir="ltr"></div>
<div><label>العنوان بالعربي</label><input name="address_ar"></div><div><label>Address English</label><input name="address_en"></div>
<div><label>Facebook</label><input name="facebook" dir="ltr"></div><div><label>Instagram</label><input name="instagram" dir="ltr"></div>
<div><label>LinkedIn</label><input name="linkedin" dir="ltr"></div><div><label>YouTube</label><input name="youtube" dir="ltr"></div>
<div class="full hero-bg-box"><label>البروفايل PDF المرتبط بالـ QR</label><div class="upload-row"><input type="file" id="profileFile" accept="application/pdf"><button class="btn primary" type="button" id="uploadProfile">رفع وتحديث البروفايل</button><button class="btn soft" type="button" id="openProfilePage">معاينة صفحة البروفايل</button></div><div class="progress" id="profileProgress">ارفع PDF جديدًا هنا. سيظل رابط QR ثابتًا ويعرض آخر نسخة محفوظة.</div><input name="profile_pdf_url" dir="ltr" readonly placeholder="سيظهر رابط PDF بعد الرفع"></div><div><label>رابط اللوجو</label><input name="logo_url" dir="ltr"></div>
<div><label>سنوات الخبرة</label><input name="years_experience" type="number"></div><div><label>عدد المشروعات</label><input name="projects_count" type="number"></div>
<div><label>عدد العملاء</label><input name="clients_count" type="number"></div><div><label>عدد المدن/الدول</label><input name="cities_count" type="number"></div>
<div class="full actions"><button class="btn primary" type="submit">حفظ الإعدادات</button></div></div><div class="msg" id="msg"></div></form></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase-config.js"></script><script src="assets/data-store.js"></script><script src="assets/unified-auth.js"></script><script>
const fields=['company_name_ar','company_name_en','hero_title_ar','hero_title_en','hero_description_ar','hero_description_en','hero_background_url','phone','whatsapp','email','website','address_ar','address_en','facebook','instagram','linkedin','youtube','profile_pdf_url','logo_url','years_experience','projects_count','clients_count','cities_count'];
function setHeroPreview(url){const box=document.querySelector('#heroPreview');box.style.backgroundImage=url?`linear-gradient(90deg,rgba(5,22,40,.82),rgba(5,22,40,.18)),url("${url}")`:'linear-gradient(135deg,#09243e,#0d6d7a)';}
async function uploadHeroBackground(){const file=document.querySelector('#heroFile').files[0],msg=document.querySelector('#heroProgress');if(!file){msg.textContent='اختر صورة أولًا.';return}if(file.size>3*1024*1024){msg.textContent='حجم الصورة أكبر من 3 MB. اضغطها قبل الرفع.';return}msg.textContent='جارٍ رفع الصورة...';try{const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`site/hero/hero-background-${Date.now()}.${ext}`;const {error}=await FlevoStore.client.storage.from(window.FLEVO_BUCKET).upload(path,file,{cacheControl:'3600',upsert:false});if(error)throw error;const {data}=FlevoStore.client.storage.from(window.FLEVO_BUCKET).getPublicUrl(path);document.querySelector('[name="hero_background_url"]').value=data.publicUrl;setHeroPreview(data.publicUrl);await FlevoStore.saveCompanySettings({hero_background_url:data.publicUrl});msg.textContent='تم رفع الخلفية وتطبيقها بنجاح.'}catch(e){msg.textContent='خطأ: '+e.message}}
async function uploadProfilePdf(){const file=document.querySelector('#profileFile').files[0],msg=document.querySelector('#profileProgress');if(!file){msg.textContent='اختر ملف PDF أولًا.';return}if(file.type!=='application/pdf'){msg.textContent='الملف يجب أن يكون PDF.';return}if(file.size>20*1024*1024){msg.textContent='حجم الملف أكبر من 20 MB.';return}msg.textContent='جارٍ رفع البروفايل...';try{const path='documents/profile/FLEVO-Company-Profile.pdf';const {error}=await FlevoStore.client.storage.from(window.FLEVO_BUCKET).upload(path,file,{cacheControl:'300',upsert:true,contentType:'application/pdf'});if(error)throw error;const {data}=FlevoStore.client.storage.from(window.FLEVO_BUCKET).getPublicUrl(path);const url=data.publicUrl+'?v='+Date.now();document.querySelector('[name="profile_pdf_url"]').value=url;await FlevoStore.saveCompanySettings({profile_pdf_url:url});msg.textContent='تم تحديث البروفايل. الـ QR نفسه سيعرض النسخة الجديدة.'}catch(e){msg.textContent='خطأ: '+e.message}}
async function load(){try{const d=await FlevoStore.getCompanySettings();fields.forEach(k=>{const el=document.querySelector(`[name="${k}"]`);if(el)el.value=d[k]??''});setHeroPreview(d.hero_background_url||'')}catch(e){document.querySelector('#msg').textContent=e.message}}
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),p={};fields.forEach(k=>p[k]=['years_experience','projects_count','clients_count','cities_count'].includes(k)?Number(f.get(k)||0):f.get(k));const m=document.querySelector('#msg');m.textContent='جارٍ الحفظ...';try{await FlevoStore.saveCompanySettings(p);m.textContent='تم الحفظ بنجاح'}catch(err){m.textContent='خطأ: '+err.message}};
document.querySelector('#uploadHero').onclick=uploadHeroBackground;document.querySelector('#uploadProfile').onclick=uploadProfilePdf;document.querySelector('#openProfilePage').onclick=()=>window.open('profile.html','_blank');document.querySelector('#heroFile').onchange=e=>{const f=e.target.files[0];if(f)setHeroPreview(URL.createObjectURL(f))};document.querySelector('#removeHero').onclick=async()=>{const m=document.querySelector('#heroProgress');try{await FlevoStore.saveCompanySettings({hero_background_url:null});document.querySelector('[name="hero_background_url"]').value='';document.querySelector('#heroFile').value='';setHeroPreview('');m.textContent='تمت إزالة الخلفية المخصصة وسيتم استخدام الخلفية الافتراضية.'}catch(e){m.textContent='خطأ: '+e.message}};
document.querySelector('#preview').onclick=()=>window.open('index.html','_blank');FlevoUnifiedAuth.protectPage({onAuthenticated:load});
</script><script src="assets/motion.js" defer></script>
<script src="assets/navigation-audit.js" defer></script>
</body></html>
